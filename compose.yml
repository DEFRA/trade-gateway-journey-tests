services:

  floci:
    image: floci/floci:latest-aws
    env_file:
      - ./config/aws.env
      - ./config/floci.env
    environment:
      FLOCI_DEFAULT_REGION: eu-west-2
      FLOCI_HOSTNAME: floci
      FLOCI_STORAGE_MODE: hybrid
    volumes:
      - ./scripts/floci/ready.d:/etc/floci/init/ready.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:4566/_localstack/health >/dev/null || exit 1"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    ports:
      - "4566:4566"

  mongodb:
    image: mongo:6.0.28
    volumes:
      - ./scripts/mongodb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--eval",
          "quit(db.hello().ok ? 0 : 1)"
        ]
      interval: 5s
      timeout: 5s
      start_period: 5s
      retries: 10
    ports:
      - "27017:27017"

  trade-tracesnt-stub:
    image: defradigital/trade-tracesnt-stub:${TRADE_TRACESNT_STUB:-latest}
    env_file:
      - ./config/trade-tracesnt-stub.env
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "--silent",
          "http://localhost:8080/health"
        ]
      interval: 3s
      timeout: 5s
      start_period: 5s
      retries: 10
    ports:
      - "3000:8080"
      - "1090:1090"

  trade-gateway:
    image: defradigital/trade-gateway:${TRADE_GATEWAY:-latest}
    env_file:
      - ./config/aws.env
      - ./config/trade-gateway.env
    environment:
      AWS_ENDPOINT_URL: http://floci:4566
    depends_on:
      floci:
        condition: service_healthy      
      mongodb:
        condition: service_healthy
      trade-tracesnt-stub:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "--silent",
          "http://localhost:8080/health"
        ]
      interval: 3s
      timeout: 5s
      start_period: 5s
      retries: 10
    ports:
      - "3001:8080"