name: Publish

on:
  push:
    branches:
      - main

permissions:
  contents: write
  id-token: write
  packages: read
  pull-requests: write

env:
  AWS_REGION: eu-west-2
  AWS_ACCOUNT_ID: '094954420758'

jobs:
  build:
    if: github.run_number != 1
    name: Build, version and publish
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Check out current repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      # Remove this step and update workflow when PR is merged: https://github.com/DEFRA/cdp-build-action/pull/120
      - name: Update NuGet.config
        run: |
          dotnet nuget remove source defra
          dotnet nuget add source --username USERNAME --password ${{ env.GITHUB_TOKEN }} --store-password-in-clear-text --name defra "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" --configfile NuGet.config

      - name: Build the test suite
        uses: DEFRA/cdp-build-action/build-test@7fe324bec9987c5a4d0f4724b42e30c282892ceb # https://github.com/DEFRA/cdp-build-action/commits/main/build-test
        with:
          github-token: ${{ env.GITHUB_TOKEN }}
