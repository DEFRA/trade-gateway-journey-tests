name: Publish

on:
  push:
    branches:
      - main

permissions:
  contents: write
  id-token: write
  packages: read
  pull-requests: write

env:
  AWS_REGION: eu-west-2
  AWS_ACCOUNT_ID: '094954420758'

jobs:
  build:
    if: github.run_number != 1
    name: Build, version and publish
    runs-on: ubuntu-latest
    env:
      DEFRA_NUGET_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Check out current repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the test suite
        uses: DEFRA/cdp-build-action/build-test@54ced5c5344c8b9620561a1628fe8f3d858e9871 # v1.5.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          build-secrets: |
            DEFRA_NUGET_PAT=${{ env.DEFRA_NUGET_PAT }}
