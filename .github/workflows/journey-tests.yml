name: Journey tests

# Reusable workflow that runs the journey tests against trade-gateway-local-environment.
# Service repos call it from their pull request workflow, and run-journey-tests.yml calls it on demand,
# optionally swapping services in the compose stack for images built from pull requests (see README.md).

on:
  workflow_call:
    inputs:
      image-artifact:
        description: Name or glob pattern of artifacts, uploaded earlier in the calling run, each containing a `docker save` tarball of an image under test
        required: false
        type: string
        default: ''
      image-tags:
        description: Compose image tag variables for the services under test, one VARIABLE=tag per line, e.g. TRADE_GATEWAY=pr-123
        required: false
        type: string
        default: ''
      image-variable:
        description: Compose image tag variable for the service under test, e.g. TRADE_GATEWAY
        required: false
        type: string
        default: ''
      image-tag:
        description: Tag of the image under test, e.g. pr-123
        required: false
        type: string
        default: ''
      journey-tests-ref:
        description: Branch, tag or SHA of the journey tests to run, for callers in other repositories
        required: false
        type: string
        default: main

permissions:
  contents: read
  id-token: write
  packages: read
  pull-requests: write

jobs:
  journey-tests:
    name: Run journey tests
    runs-on: ubuntu-latest
    env:
      DEFRA_NUGET_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      # A called workflow checks out the caller's repository by default, so name this one explicitly.
      # github.sha is the caller's commit, so only use it when the caller is this repository.
      - name: Checkout journey tests
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: DEFRA/trade-gateway-journey-tests
          ref: ${{ github.repository == 'DEFRA/trade-gateway-journey-tests' && github.sha || inputs.journey-tests-ref }}

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            10.0

      - name: Log in to Docker Hub
        uses: DEFRA/cdp-build-action/docker-login@54ced5c5344c8b9620561a1628fe8f3d858e9871 # v1.5.0

      - name: Download images under test
        if: inputs.image-artifact != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ${{ inputs.image-artifact }}
          merge-multiple: true
          path: images-under-test

      - name: Load images under test
        if: inputs.image-artifact != ''
        run: |
          for image in images-under-test/*.tar; do
            docker load --input "$image"
          done

      - name: Checkout trade-gateway-local-environment
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: DEFRA/trade-gateway-local-environment
          ref: 0.5.0
          path: trade-gateway-local-environment

      # The loaded images are already present locally, so compose uses them rather than pulling.
      - name: Start trade-gateway-local-environment
        working-directory: trade-gateway-local-environment
        env:
          IMAGE_TAGS: ${{ inputs.image-tags }}
          IMAGE_VARIABLE: ${{ inputs.image-variable }}
          IMAGE_TAG: ${{ inputs.image-tag }}
        run: |
          if [ -n "$IMAGE_VARIABLE" ]; then
            IMAGE_TAGS="$IMAGE_TAGS"$'\n'"$IMAGE_VARIABLE=$IMAGE_TAG"
          fi
          while IFS= read -r image_tag; do
            if [ -n "$image_tag" ]; then
              export "$image_tag"
              echo "Using $image_tag"
              echo "- \`$image_tag\`" >> "$RUNNER_TEMP/images-under-test.md"
            fi
          done <<< "$IMAGE_TAGS"
          docker compose up --wait --wait-timeout 300 --quiet-pull

      - name: Run journey tests
        run: >-
          dotnet test --results-directory reports
          --report-html --report-html-filename index.html
          --report-xunit-markdown --report-xunit-markdown-filename summary.md
          --report-xunit-ctrf --report-xunit-ctrf-filename results.json

      - name: Publish test summary
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/images-under-test.md" ]; then
            {
              echo "### Images under test"
              cat "$RUNNER_TEMP/images-under-test.md"
              echo
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f reports/summary.md ]; then
            cat reports/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No test results - the journey tests did not run." >> "$GITHUB_STEP_SUMMARY"
          fi

      # Keeps a single comment per pull request, found by the marker on its first line and
      # replaced on each run. Fork and Dependabot pull requests get a read-only token, so a
      # failure to comment doesn't fail the job.
      - name: Comment test summary on pull request
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          marker='<!-- journey-tests-summary -->'
          results=reports/results.json
          comment="$RUNNER_TEMP/journey-tests-comment.md"
          {
            echo "$marker"
            if [ -f "$results" ]; then
              failed=$(jq '.results.summary.failed' "$results")
              if [ "$failed" -eq 0 ]; then
                echo "## ✅ Journey tests passed"
              else
                echo "## ❌ Journey tests failed"
              fi
              echo
              echo "| Total | Passed | Failed | Skipped | Duration |"
              echo "|---|---|---|---|---|"
              jq -r '.results.summary | "| \(.tests) | \(.passed) | \(.failed) | \(.skipped + .pending + .other) | \(.duration / 1000 | floor)s |"' "$results"
              if [ "$failed" -gt 0 ]; then
                echo
                echo "### Failed tests"
                jq -r '.results.tests[] | select(.status == "failed") | "- `\(.name)`"' "$results"
              fi
            else
              echo "## ⚠️ Journey tests did not run"
            fi
            echo
            echo "[See the full report]($RUN_URL)"
          } > "$comment"

          comment_id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" | head -n 1)
          if [ -n "$comment_id" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" -F body=@"$comment" > /dev/null
          else
            gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$comment"
          fi

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: journey-test-reports
          path: ./reports

      - name: Capture Docker Compose logs
        if: always()
        working-directory: trade-gateway-local-environment
        run: docker compose logs > logs.txt

      - name: Upload Docker Compose logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: journey-test-docker-compose-logs
          path: trade-gateway-local-environment/logs.txt
